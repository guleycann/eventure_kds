<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Detayları</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
            margin: 20px;
        }
        .chart-box {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            flex: 1 1 45%; /* İki sütun olacak şekilde */
            height: 500px; /* Yükseklik artırıldı */
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .large-chart {
            flex: 1 1 100%;
            height: 400px; /* Büyük grafik için düzenlendi */
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        select {
            margin-bottom: 10px;
            padding: 5px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1 id="category-title">Kategori Detayları</h1>

<div class="chart-container">
    <!-- Pie Chart: Mevsimlere Göre Talepler -->
    <div class="chart-box">
        <h2 id="season-title">Mevsimlere Göre Talepleri</h2>
        <canvas id="seasonalChart"></canvas>
    </div>

    <script src="/js/category-detail.js"></script>

    <!-- Bar Chart: Konsept Talepleri veya Aylık Talepler -->
    <div class="chart-box">
        <h2 id="concept-title">Konsept Talepleri</h2>
        <select id="yearSelect" onchange="updateConceptChart()">
            <option value="2024" selected>2024</option>
            <option value="2023">2023</option>
        </select>
        <canvas id="conceptChart"></canvas>
    </div>
    
    <div class="chart-box" id="monthlyChartBox" style="display: none;">
        <h2>Aylık Talepler</h2>
        <canvas id="monthlyChart"></canvas>
    </div>
    
    <script src="/js/category-detail.js"></script>
    

    
    <!-- Line Chart: Gelir Getirileri -->
    <div class="chart-box large-chart">
        <h2>Gelir Getirileri</h2>
        <canvas id="revenueLineChart"></canvas>
    </div>
</div>

<script>
    // --- Category Detection ---
    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category') || 'Düğün';
    document.getElementById('category-title').textContent = `${category} Detayları`;
    document.getElementById('season-title').textContent = `Mevsimlere Göre ${category} Talepleri`;
    const conceptTitle = document.getElementById('concept-title');
    conceptTitle.textContent = category === 'Düğün' ? 'Konsept Talepleri' : 'Aylık Talepler';

    // --- Pie Chart: Mevsimlere Göre Talepler ---
    const seasonData = {
        labels: ['Kış', 'İlkbahar', 'Yaz', 'Sonbahar'],
        datasets: [{
            data: [20, 25, 35, 20],
            backgroundColor: ['#0B3D91', '#50A1FF', '#A9D8FF', '#00416A']
        }]
    };

    new Chart(document.getElementById('seasonPieChart'), {
        type: 'pie',
        data: seasonData,
        options: { plugins: { legend: { position: 'bottom' } } }
    });

    // --- Bar Chart: Konsept Talepleri veya Aylık Talepler ---
    const conceptData = {
        2024: [
            [8, 10, 12, 15, 17, 18, 19, 20, 21, 18, 14, 10],
            [5, 7, 9, 11, 13, 15, 16, 18, 19, 16, 12, 8],
            [10, 12, 14, 16, 18, 20, 22, 23, 21, 19, 15, 12]
        ],
        2023: [
            [7, 9, 11, 13, 15, 16, 18, 19, 20, 17, 13, 9],
            [4, 6, 8, 10, 12, 14, 15, 17, 18, 14, 10, 6],
            [9, 11, 13, 15, 17, 19, 21, 22, 20, 18, 14, 11]
        ]
    };
    const labels = [
        'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 
        'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'
    ];

    const conceptChart = new Chart(document.getElementById('conceptChart'), {
        type: 'bar',
        data: { labels, datasets: [] },
        options: {
            responsive: true,
            maintainAspectRatio: true, /* Grafik oranını korur */
            plugins: { legend: { display: category === 'Düğün' } },
            scales: { y: { beginAtZero: true, max: 25 } }
        }
    });

    function updateConceptChart() {
        const year = document.getElementById('yearSelect').value;
        if (category === 'Düğün') {
            conceptChart.data.datasets = [
                { label: 'Kır Düğünü', data: conceptData[year][0], backgroundColor: '#8BC34A' },
                { label: 'Sahil Düğünü', data: conceptData[year][1], backgroundColor: '#00BCD4' },
                { label: 'Salon Düğünü', data: conceptData[year][2], backgroundColor: '#1E88E5' }
            ];
        } else {
            monthlyChart.data.datasets = [
                { label: 'Aylık Talepler', data: conceptData[year][0], backgroundColor: '#8BC34A' }
            ];
        }
        monthlyChart.update();
    }
    updateConceptChart();

    // --- Line Chart: Gelir Getirileri ---
    new Chart(document.getElementById('revenueLineChart'), {
        type: 'line',
        data: {
            labels: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran'],
            datasets: [{
                label: 'Gelir Getirileri',
                data: [10, 20, 25, 30, 50, 70],
                borderColor: '#4CAF50',
                backgroundColor: 'transparent',
                tension: 0.3
            }]
        },
        options: { responsive: true, maintainAspectRatio: true }
    });
</script>

</body>
</html>
