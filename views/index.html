<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Analizleri</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }
        .chart-box {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            width: 45%;
        }
        .chart-box h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #555;
        }
    </style>
</head>
<body>

<h1>Kategori Analizleri</h1>

<div class="chart-container">
    <!-- Pie Chart: En Popüler Etkinlikler -->
    <div class="chart-box">
        <h2>En Popüler Etkinlikler</h2>
        <canvas id="popularEventsChart"></canvas>
    </div>

    <!-- Bar Chart: Kategori Bazlı Kişi Kapasiteleri -->
    <div class="chart-box">
        <h2>Kategori Bazlı Kişi Kapasiteleri</h2>
        <select id="barYearSelect" onchange="updateBarChart()">
            <option value="2024">2024</option>
            <option value="2023">2023</option>
        </select>
        <canvas id="capacityChart"></canvas>
    </div>

    <!-- Line Chart: Gelir Getirileri -->
    <div class="chart-box" style="width: 90%;">
        <h2>Gelir Getirileri</h2>
        <select id="lineYearSelect" onchange="updateLineChart()">
            <option value="2024">2024</option>
            <option value="2023">2023</option>
        </select>
        <canvas id="revenueChart"></canvas>
    </div>
</div>

<script>
    // --- Pie Chart: En Popüler Etkinlikler ---
    const popularEvents = ['Düğün', 'Doğum Günü', 'Evlilik Teklifi', 'Nişan', 'Müzayede', 'Gala Yemeği'];
    const popularEventData = [42, 21, 14, 7, 10, 6]; // Example data

    const popularEventsChart = new Chart(document.getElementById('popularEventsChart'), {
        type: 'pie',
        data: {
            labels: popularEvents,
            datasets: [{
                data: popularEventData,
                backgroundColor: ['#6A0DAD', '#FF4500', '#FF8C00', '#B22222', '#8B008B', '#1E90FF']
            }]
        },
        options: {
            onClick: function(event, elements) {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const selectedCategory = popularEvents[index];
                    window.location.href = `category-details.html?category=${encodeURIComponent(selectedCategory)}`;
                }
            },
            plugins: { legend: { position: 'bottom' } }
        }
    });

    // --- Bar Chart: Kategori Bazlı Kişi Kapasiteleri ---
    const barChartData = {
        2024: [[5, 10, 15, 20, 25], [8, 12, 18, 24, 20], [4, 9, 12, 18, 10]],
        2023: [[3, 6, 9, 12, 15], [5, 10, 15, 20, 17], [2, 4, 6, 8, 12]]
    };
    const barLabels = ['January', 'February', 'March', 'June', 'July'];
    const barChart = new Chart(document.getElementById('capacityChart'), {
        type: 'bar',
        data: { labels: barLabels, datasets: [] },
        options: { plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
    });

    function updateBarChart() {
        const year = document.getElementById('barYearSelect').value;
        const [set1, set2, set3] = barChartData[year];
        barChart.data.datasets = [
            { label: 'Kır Düğünü', data: set1, backgroundColor: '#4CAF50' },
            { label: 'Sahil Düğünü', data: set2, backgroundColor: '#03A9F4' },
            { label: 'Salon Düğünü', data: set3, backgroundColor: '#FF9800' }
        ];
        barChart.update();
    }
    updateBarChart();

    // --- Line Chart: Gelir Getirileri ---
    const lineChartData = {
        2024: [10, 20, 30, 40, 50, 60],
        2023: [5, 15, 25, 35, 45, 55]
    };
    const lineLabels = ['January', 'February', 'March', 'April', 'May', 'June'];

    const lineChart = new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: lineLabels,
            datasets: [{
                label: 'Gelir Getirileri',
                data: [],
                borderColor: '#FF5722',
                backgroundColor: 'transparent',
                tension: 0.4
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
    });

    function updateLineChart() {
        const year = document.getElementById('lineYearSelect').value;
        lineChart.data.datasets[0].data = lineChartData[year];
        lineChart.update();
    }
    updateLineChart();
</script>

</body>
</html>
